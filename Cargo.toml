[package]
name = "clikk"
version = "0.1.0"
edition = "2024"
description = "Aomi app for the Clikk Profile API: look up a member's published Clikk Card by handle"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aomi-sdk = "=6.0.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
schemars = "1.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
